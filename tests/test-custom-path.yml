name: Test custom license file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom license file with current year
        run: |
          CURRENT_YEAR=$(date +%Y)
          mkdir -p docs
          echo "Apache License" > docs/LICENSE.txt
          echo "" >> docs/LICENSE.txt
          echo "Copyright ${CURRENT_YEAR} Test Author" >> docs/LICENSE.txt
          echo "" >> docs/LICENSE.txt
          echo "Licensed under the Apache License, Version 2.0." >> docs/LICENSE.txt
          cat docs/LICENSE.txt
          echo "Created docs/LICENSE.txt with year: ${CURRENT_YEAR}"

      - name: Run action with custom path
        id: action
        uses: .
        with:
          token: fake-token-for-testing
          path: docs/LICENSE.txt
        continue-on-error: true

      - name: Assert action ran with custom path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (no update needed) or fail at GitHub API
          # It should NOT fail before even attempting to process the license file
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom path (license year is current)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom path and failed at GitHub API (expected with fake token)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
