name: Test no matching files
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up local git remote to avoid network dependency
        run: |
          # Create a local bare repository to serve as the git remote
          git init --bare /tmp/test-remote-no-match.git
          # Point origin to the local bare repo
          git remote set-url origin /tmp/test-remote-no-match.git
          # Push the current branch so the remote is initialized
          git push origin HEAD:act-harness

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Use a path that won't match any files in the workspace
          path: NONEXISTENT_LICENSE_FILE_XYZ_ABCDEF_99999.txt
          branchName: "test/act-no-matching-files-{{currentYear}}"

      - name: Assert action failed due to no matching files
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail — no files matched the path
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no files match the path, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no files matched the path"
