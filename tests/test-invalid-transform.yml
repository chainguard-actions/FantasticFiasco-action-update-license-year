name: Test invalid transform input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The transform validation in inputs.parse() runs before any git operations.
      # A transform without the required (?<from>) named capturing group causes
      # an immediate failure before any git/network calls are made.
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: LICENSE
          # This transform is missing the required (?<from>) named capturing group.
          # validateTransform() will throw before any git operations.
          transform: "\\d{4}"

      - name: Assert action failed due to invalid transform
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid transform, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid transform"
