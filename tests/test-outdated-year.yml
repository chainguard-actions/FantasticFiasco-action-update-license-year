name: Test outdated license year detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create LICENSE file with outdated year
        run: |
          echo "MIT License" > LICENSE
          echo "" >> LICENSE
          echo "Copyright (c) 2020 Test Author" >> LICENSE
          echo "" >> LICENSE
          echo "Permission is hereby granted, free of charge, to any person obtaining a copy" >> LICENSE
          echo "of this software and associated documentation files (the \"Software\"), to deal" >> LICENSE
          echo "in the Software without restriction." >> LICENSE
          cat LICENSE
          echo "Created LICENSE with outdated year: 2020"

      - name: Run action with outdated license year
        id: action
        uses: .
        with:
          token: fake-token-for-testing
          path: LICENSE
          branchName: license/copyright-to-{{currentYear}}
          commitTitle: "docs(license): update copyright year(s)"
          commitAuthorName: github-actions
          commitAuthorEmail: github-actions@github.com
        continue-on-error: true

      - name: Assert action detected outdated year and attempted update
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CURRENT_YEAR: ${{ steps.action.outputs.currentYear }}
        run: |
          echo "outcome: $OUTCOME"
          echo "currentYear output: $CURRENT_YEAR"
          # With an outdated year, the action should detect the need to update
          # and attempt to create a branch/PR. It will fail at GitHub API with fake token.
          # The action should NOT fail before detecting the outdated year.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed at GitHub API stage (expected with fake token)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
