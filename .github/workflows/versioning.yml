name: Keep the versions up-to-date

on:
  release:
    types: [published]

permissions: {}

jobs:
  actions-tagger:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: Actions-R-Us/actions-tagger@330ddfac760021349fef7ff62b372f2f691c20fb # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
