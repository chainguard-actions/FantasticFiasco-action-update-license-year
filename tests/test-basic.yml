name: Test basic invocation with outdated license year
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create LICENSE file with outdated year
        run: |
          CURRENT_YEAR=$(date +%Y)
          LAST_YEAR=$((CURRENT_YEAR - 1))
          mkdir -p "$GITHUB_WORKSPACE/test-license-basic"
          cat > "$GITHUB_WORKSPACE/test-license-basic/LICENSE" << EOF
          MIT License

          Copyright (c) ${LAST_YEAR} Test Author

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction.
          EOF
          echo "Created LICENSE with outdated year: ${LAST_YEAR}"
          cat "$GITHUB_WORKSPACE/test-license-basic/LICENSE"

      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          path: test-license-basic/LICENSE
          branchName: license/copyright-to-{{currentYear}}
          commitTitle: 'docs(license): update copyright year(s)'
          prTitle: Update license copyright year(s)
        continue-on-error: true

      - name: Assert action ran and attempted to process the license
        env:
          ACTION_OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $ACTION_OUTCOME"
          # The action will fail at GitHub API step with a fake token,
          # but it should have at least started and attempted to process the file.
          # We accept either success (unlikely with fake token) or failure (expected).
          if [ "$ACTION_OUTCOME" = "success" ] || [ "$ACTION_OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$ACTION_OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$ACTION_OUTCOME'"
            exit 1
          fi
